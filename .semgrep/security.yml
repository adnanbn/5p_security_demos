rules:
  - id: laravel-log-entire-request
    message: Log selected security fields; do not log the complete request payload.
    severity: ERROR
    languages:
      - php
    patterns:
      - pattern-either:
          - pattern: Log::$METHOD(..., $REQUEST->all(), ...)
          - pattern: Log::$METHOD(..., $REQUEST->headers->all(), ...)

  - id: laravel-env-outside-config
    message: Read environment values through Laravel configuration, not directly in application code.
    severity: ERROR
    languages:
      - php
    paths:
      include:
        - app/
        - routes/
    pattern: env(...)

  - id: frontend-untrusted-html-sink
    message: Render untrusted content as text; raw HTML and trust-bypass APIs require a reviewed sanitization boundary.
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - /examples/**/*.ts
        - /examples/**/*.tsx
    pattern-either:
      - pattern-regex: 'dangerouslySetInnerHTML\s*='
      - pattern-regex: '\.bypassSecurityTrustHtml\s*\('
      - pattern-regex: '\.innerHTML\s*='
