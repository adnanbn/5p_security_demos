# Teaching example. Review limits, upstream names, and paths for your environment.

limit_req_zone $binary_remote_addr zone=partner_api:10m rate=30r/m;

server {
    listen 80;
    server_name security-demo.example.test;
    root /srv/app/public;
    index index.php;

    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ~* /(backup|config|debug|phpinfo|vendor/phpunit) {
        return 404;
    }

    location /api/partner/ {
        limit_req zone=partner_api burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass php-fpm:9000;
    }
}
