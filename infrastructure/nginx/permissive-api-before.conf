# Vulnerable before-state for incident 2.
# Every unknown path is forwarded to Laravel's fallback route.

server {
    listen 80;
    server_name security-demo.example.test;
    root /srv/app/public;
    index index.php;

    location /api/partner/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass php-fpm:9000;
    }
}
